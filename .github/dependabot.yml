# Veille automatisée sur les dépendances (npm, images Docker, actions GitHub).
version: 2
updates:
  - { package-ecosystem: npm, directory: /backend, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /worker, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /frontend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /backend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /worker, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /frontend, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: monthly } }
  - { package-ecosystem: terraform, directory: /infra/terraform, schedule: { interval: monthly } }
