# Stack complète en local : front + back + worker + PostgreSQL + RabbitMQ + MinIO.
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose up --build
#   -> http://localhost:8080 (application) · http://localhost:15672 (RabbitMQ) · http://localhost:9001 (MinIO)
name: biblio

x-app-env: &app-env
  PGHOST: postgres
  PGDATABASE: library
  PGUSER: library_app
  PGPASSWORD: ${APP_DB_PASSWORD:?}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:?}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
  S3_ENDPOINT: minio
  S3_PORT: "9000"
  S3_ACCESS_KEY: ${S3_APP_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_APP_SECRET_KEY:?}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_USER: library_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      APP_DB_NAME: library
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./helm/library-data/files/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    # Fork communautaire maintenu de MinIO (MinIO Inc. ne publie plus d'images depuis fin 2025).
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?}
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: pgsty/mc:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:?}
      APP_SECRET_KEY: ${S3_APP_SECRET_KEY:?}
      BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:?}
      BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:?}
    volumes:
      - ./helm/library-data/files/minio-init.sh:/init.sh:ro
    depends_on: [minio]
    restart: "no"

  backend:
    build: { context: ./backend, args: { APP_VERSION: compose } }
    image: biblio-backend:local
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ./worker, args: { APP_VERSION: compose } }
    image: biblio-worker:local
    environment:
      <<: *app-env
    depends_on:
      backend: { condition: service_started }

  frontend:
    build: ./frontend
    image: biblio-frontend:local
    environment:
      BACKEND_URL: http://backend:3000
    ports: ["8080:8080"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
