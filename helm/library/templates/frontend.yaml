apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        {{- include "library.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        {{- include "library.podSecurity" . | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "library.image" (dict "root" . "name" "frontend" "tag" "") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: BACKEND_URL, value: "http://backend:3000" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 15
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- include "library.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Seuls répertoires inscriptibles (FS racine en lecture seule).
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "library.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
