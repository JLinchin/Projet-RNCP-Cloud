{{- if and .Values.canary.enabled .Values.canary.tag }}
# Déploiement canary : même Service que la version stable, part de trafic proportionnelle
# au nombre de réplicas. Promu (ou annulé) par scripts/canary.sh dans le pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  labels:
    app.kubernetes.io/name: backend
    track: canary
    {{- include "library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.canary.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      track: canary
  template:
    {{- include "library.backendPod" (dict "root" . "track" "canary" "tag" .Values.canary.tag) | nindent 4 }}
{{- end }}
