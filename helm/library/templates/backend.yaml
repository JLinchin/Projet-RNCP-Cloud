apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    {{- include "library.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  # Rolling update sans interruption : on ajoute un pod avant d'en retirer un.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      track: stable
  template:
    {{- include "library.backendPod" (dict "root" . "track" "stable" "tag" "") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    {{- include "library.labels" . | nindent 4 }}
spec:
  # Sélecteur volontairement sans « track » : stable ET canary reçoivent le trafic.
  selector:
    app.kubernetes.io/name: backend
  ports:
    - { name: http, port: 3000, targetPort: http }
---
{{- if .Values.backend.hpa.enabled }}
# Autoscaling horizontal sur l'utilisation CPU (rapportée aux requests).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  labels: {{- include "library.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: {{ .Values.backend.hpa.minReplicas }}
  maxReplicas: {{ .Values.backend.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.backend.hpa.targetCPU }} }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 120   # évite le « flapping » et donc des démarrages inutiles
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
---
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  labels: {{- include "library.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
