apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    {{- include "library.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        biblio/db-access: "true"
        biblio/s3-access: "true"
        biblio/amqp-access: "true"
        {{- include "library.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        {{- include "library.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "library.image" (dict "root" . "name" "worker" "tag" "") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: metrics, containerPort: 9100 }
          envFrom:
            - configMapRef: { name: library-config }
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- include "library.dataEnv" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- include "library.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  labels:
    app.kubernetes.io/name: worker
    {{- include "library.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: worker }
  ports:
    - { name: metrics, port: 9100, targetPort: metrics }
