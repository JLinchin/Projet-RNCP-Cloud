# Valeurs par défaut (surchargées par Terraform pour chaque environnement).
storageClass: standard # local-path-provisioner fourni par kind

secrets:
  postgres: library-postgres      # POSTGRES_PASSWORD, APP_DB_PASSWORD
  rabbitmq: library-rabbitmq      # RABBITMQ_USER, RABBITMQ_PASSWORD
  minioRoot: library-minio-root   # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_KMS_SECRET_KEY
  s3App: library-s3-app           # S3_ACCESS_KEY, S3_SECRET_KEY
  s3Backup: library-s3-backup     # S3_ACCESS_KEY, S3_SECRET_KEY

postgres:
  image: postgres:16.9-alpine
  database: library
  appUser: library_app
  storage: 1Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

rabbitmq:
  image: rabbitmq:4.1-management-alpine
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

minio:
  # Fork communautaire maintenu (Pigsty) : MinIO Inc. a archivé ses images communautaires fin 2025.
  image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
  mcImage: pgsty/mc:latest
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

backup:
  enabled: true
  schedule: "0 2 * * *"   # tous les jours à 02:00
  retentionDays: 30       # expiration automatique (règle de cycle de vie du bucket)

monitoringNamespace: monitoring
