apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels: {{- include "data.labels" . | nindent 4 }}
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  20-prometheus.conf: |
    # Métriques par file (profondeur de la file / DLQ) exposées sur :15692/metrics
    prometheus.return_per_object_metrics = true
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    {{- include "data.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
    - { name: metrics, port: 15692 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    {{- include "data.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        {{- include "data.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.rabbitmq }}, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.rabbitmq }}, key: RABBITMQ_PASSWORD } }
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: metrics, containerPort: 15692 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources: {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
            - { name: config, mountPath: /etc/rabbitmq/conf.d/20-prometheus.conf, subPath: 20-prometheus.conf }
            - { name: data, mountPath: /var/lib/rabbitmq }
      volumes:
        - name: config
          configMap: { name: rabbitmq-config }
        # Arbitrage : file non persistée (les reçus peuvent être régénérés) -> pas de PV à payer.
        - name: data
          emptyDir: {}
