{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  endpoints:
    - port: s3
      path: /minio/v2/metrics/cluster
      interval: 60s
{{- end }}
