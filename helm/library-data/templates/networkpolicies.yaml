# Segmentation réseau (« zero trust » intra-namespace). Une politique deny-all par défaut est
# posée par Terraform ; on n'ouvre ici que les flux strictement nécessaires.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { biblio/db-access: "true" }
      ports:
        - { port: 5432, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-allow
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { biblio/amqp-access: "true" }
      ports:
        - { port: 5672, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }} }
      ports:
        - { port: 15692, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow
  labels: {{- include "data.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: minio }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { biblio/s3-access: "true" }
      ports:
        - { port: 9000, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }} }
      ports:
        - { port: 9000, protocol: TCP }
