apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "data.labels" . | nindent 4 }}
data:
  10-app-role.sh: |
{{ .Files.Get "files/postgres-init.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "data.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "data.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "data.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70        # utilisateur « postgres » de l'image alpine
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "password_encryption=scram-sha-256"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres }}, key: POSTGRES_PASSWORD } }
            - name: APP_DB_USER
              value: {{ .Values.postgres.appUser }}
            - name: APP_DB_NAME
              value: {{ .Values.postgres.database }}
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.postgres }}, key: APP_DB_PASSWORD } }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "data.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  # PersistentVolume : les données survivent à la suppression/recréation du pod.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
