apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    {{- include "data.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: s3, port: 9000 }
    - { name: console, port: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    {{- include "data.labels" . | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        {{- include "data.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.minioRoot }}, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.minioRoot }}, key: MINIO_ROOT_PASSWORD } }
            # Clé maîtresse de la KMS intégrée : active le chiffrement SSE-S3 des objets au repos.
            - name: MINIO_KMS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.minioRoot }}, key: MINIO_KMS_SECRET_KEY } }
            # Métriques accessibles sans jeton : l'accès est restreint au namespace monitoring par NetworkPolicy.
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
            - name: HOME
              value: /tmp
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext: {{- include "data.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-init
  labels: {{- include "data.labels" . | nindent 4 }}
data:
  init.sh: |
{{ .Files.Get "files/minio-init.sh" | indent 4 }}
---
# Job d'initialisation (buckets, chiffrement, cycle de vie, comptes au moindre privilège).
# Rejoué à chaque installation / mise à jour du chart : le script est idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels: {{- include "data.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        biblio/s3-access: "true"
        {{- include "data.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            - { name: MINIO_URL, value: "http://minio:9000" }
            - { name: BACKUP_RETENTION_DAYS, value: {{ .Values.backup.retentionDays | quote }} }
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.minioRoot }}, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.minioRoot }}, key: MINIO_ROOT_PASSWORD } }
            - name: APP_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.s3App }}, key: S3_ACCESS_KEY } }
            - name: APP_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.s3App }}, key: S3_SECRET_KEY } }
            - name: BACKUP_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.s3Backup }}, key: S3_ACCESS_KEY } }
            - name: BACKUP_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.s3Backup }}, key: S3_SECRET_KEY } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext: {{- include "data.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap: { name: minio-init }
        - name: tmp
          emptyDir: {}
